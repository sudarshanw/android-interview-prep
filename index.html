<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Android Interview Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Newsreader:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f3;--panel:#fff;--ink:#16221f;--muted:#5d6b67;--line:#d5dcd9;--accent:#0b7a63;--accent-soft:#dcefe9;--key:#fff3cf;--key-line:#d9a514;--code:#e8eeec}
@media (prefers-color-scheme:dark){:root{--bg:#101716;--panel:#172220;--ink:#e6efec;--muted:#93a5a0;--line:#2a3b38;--accent:#4fd1b0;--accent-soft:#1c3530;--key:#33290c;--key-line:#d9a514;--code:#223330}}
*{box-sizing:border-box}
html{scroll-padding-top:1rem}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.65 "Newsreader",Georgia,serif}
h1,h2,h3,.ui{font-family:"Bricolage Grotesque",system-ui,sans-serif}
.layout{display:grid;grid-template-columns:340px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:1.5rem 1.25rem;position:sticky;top:0;height:100vh;overflow:auto;background:var(--panel)}
aside h1{font-size:1.5rem;line-height:1.15;margin:0 0 .25rem;font-weight:800}
aside p{margin:0 0 1rem;color:var(--muted);font-size:.95rem}
input{width:100%;padding:.6rem .75rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;font-size:.95rem}
input:focus-visible,a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.cats{display:flex;flex-wrap:wrap;gap:.4rem;margin:.9rem 0}
.cats button{font:600 .8rem "Bricolage Grotesque",sans-serif;padding:.3rem .65rem;border-radius:99px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer}
.cats button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
nav a{display:block;padding:.6rem .7rem;border-radius:6px;color:var(--ink);text-decoration:none;font-size:.95rem;line-height:1.35;border-left:3px solid transparent}
nav a small{display:block;color:var(--muted);font:600 .75rem "Bricolage Grotesque",sans-serif;margin-bottom:.1rem}
nav a:hover{background:var(--bg)}
nav a[aria-current=true]{background:var(--accent-soft);border-left-color:var(--accent)}
.empty{color:var(--muted);font-size:.95rem;padding:.5rem}
main{padding:3rem clamp(1.25rem,5vw,4rem);max-width:820px}
.tag{display:inline-block;font:600 .85rem "Bricolage Grotesque",sans-serif;background:var(--accent-soft);color:var(--accent);padding:.2rem .65rem;border-radius:4px}
main h2{font-size:clamp(1.7rem,3.6vw,2.4rem);line-height:1.15;margin:.9rem 0 1.25rem;font-weight:800}
.intro{font-size:1.15rem}
h3{font-size:1.15rem;margin:2rem 0 .5rem;padding-top:1rem;border-top:1px solid var(--line)}
ul{padding-left:1.2rem}li{margin:.35rem 0}
code{font:.85em ui-monospace,Menlo,Consolas,monospace;background:var(--code);padding:.1em .4em;border-radius:4px}
.key{margin-top:2.25rem;padding:1rem 1.25rem;background:var(--key);border-left:5px solid var(--key-line);border-radius:0 6px 6px 0}
.key b{font-family:"Bricolage Grotesque",sans-serif}
.pager{display:flex;justify-content:space-between;gap:1rem;margin-top:2.5rem}
.pager a{color:var(--accent);font:600 .95rem "Bricolage Grotesque",sans-serif;text-decoration:none}
@media (max-width:820px){.layout{grid-template-columns:1fr}aside{position:static;height:auto;max-height:60vh;border-right:0;border-bottom:1px solid var(--line)}main{padding-top:2rem}}
</style>
</head>
<body>
<div class="layout">
  <aside>
    <h1>Android Interview Prep</h1>
    <p id="count"></p>
    <input id="search" type="search" placeholder="Search questions" aria-label="Search questions">
    <div class="cats" id="cats" role="group" aria-label="Filter by category"></div>
    <nav id="list" aria-label="Questions"></nav>
  </aside>
  <main id="view" tabindex="-1"></main>
</div>
<script src="questions.js"></script>
<script>
const $ = id => document.getElementById(id);
let cat = "All", q = "";
const cats = ["All", ...new Set(QUESTIONS.map(x => x.category))];
const text = x => (x.question + " " + x.category + " " + JSON.stringify(x.sections) + (x.intro||"")).toLowerCase();

function visible(){ return QUESTIONS.filter(x => (cat==="All"||x.category===cat) && text(x).includes(q)); }

function renderCats(){
  $("cats").innerHTML = cats.map(c => `<button aria-pressed="${c===cat}" data-c="${c}">${c}</button>`).join("");
}
function renderList(){
  const items = visible(), cur = location.hash.slice(1);
  $("count").textContent = `${QUESTIONS.length} question${QUESTIONS.length===1?"":"s"}`;
  $("list").innerHTML = items.length
    ? items.map(x => `<a href="#${x.id}" ${x.id===cur?'aria-current="true"':""}><small>${x.category}</small>${x.question}</a>`).join("")
    : `<p class="empty">No questions match. Try a different word.</p>`;
}
function renderAnswer(){
  const id = location.hash.slice(1), i = QUESTIONS.findIndex(x => x.id===id), x = QUESTIONS[i] || QUESTIONS[0];
  if(!x) return;
  const k = QUESTIONS.indexOf(x), prev = QUESTIONS[k-1], next = QUESTIONS[k+1];
  document.title = x.question + " | Android Interview Prep";
  $("view").innerHTML = `
    <span class="tag">${x.category}</span>
    <h2>${x.question}</h2>
    ${x.intro ? `<p class="intro">${x.intro}</p>` : ""}
    ${x.sections.map(s => `<h3>${s.title}</h3>${s.text?`<p>${s.text}</p>`:""}${s.points?`<ul>${s.points.map(p=>`<li>${p}</li>`).join("")}</ul>`:""}`).join("")}
    ${x.keyPoint ? `<div class="key"><b>Key interview point.</b> ${x.keyPoint}</div>` : ""}
    <div class="pager"><span>${prev?`<a href="#${prev.id}">Previous: ${prev.question.slice(0,40)}…</a>`:""}</span><span>${next?`<a href="#${next.id}">Next: ${next.question.slice(0,40)}…</a>`:""}</span></div>`;
}
$("cats").onclick = e => { if(e.target.dataset.c){ cat = e.target.dataset.c; renderCats(); renderList(); } };
$("search").oninput = e => { q = e.target.value.toLowerCase().trim(); renderList(); };
addEventListener("hashchange", () => { renderList(); renderAnswer(); $("view").focus(); scrollTo(0,0); });
renderCats(); renderList(); renderAnswer();
</script>
</body>
</html>
